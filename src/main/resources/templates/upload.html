<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    label {
      margin-bottom: 10px;
      color: #555;
    }
    input[type="file"], input[type="text"] {
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 60%;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    .qr-code {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
<h1>인식할 약봉투 사진을 등록해주세요~~!</h1>
<p>Logged in as: <span th:text="${member_id}"></span></p>
<form action="/api/v1/medicines/photo" method="post" enctype="multipart/form-data">
  <label for="file">Choose file to upload:</label>
  <input type="file" id="file" name="file" required><br>
  <button type="submit">Upload File</button>
</form>

<div class="qr-code" th:if="${qrCode}">
  <h2>Generated QR Code:</h2>
  <img th:src="'data:image/png;base64,' + ${qrCode}" alt="QR Code">
</div>

<div th:if="${error}">
  <h2>Error:</h2>
  <p th:text="${error}"></p>
</div>

</body>
</html>
