<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    label {
      margin-bottom: 10px;
      color: #555;
    }
    input[type="file"], input[type="text"] {
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 100%;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    .qr-code {
      margin-top: 20px;
      text-align: center;
    }
    #photos {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    #photos img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
    }
    .error-message {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<h1>인식할 약봉투 사진을 등록해주세요~~!</h1>
<p>Logged in as: <span th:text="${member_id}"></span></p>
<form id="uploadForm" action="/api/v1/medicines/photo" method="post" enctype="multipart/form-data">
  <label for="file">Choose file to upload:</label>
  <input type="file" id="file" name="file" required><br>
  <button type="submit">Upload File</button>
</form>

<div class="qr-code" th:if="${qrCode}">
  <h2>Generated QR Code:</h2>
  <img th:src="'data:image/png;base64,' + ${qrCode}" alt="QR Code">
</div>

<div th:if="${error}">
  <h2>Error:</h2>
  <p th:text="${error}"></p>
</div>

<div id="message" th:text="${message}"></div>

<h2>Uploaded Photos:</h2>
<div id="photos">
  <div th:each="photo : ${uploadedPhotos}">
    <!-- 상대 경로 대신 실제 파일 경로를 설정 -->
    <img th:src="@{'/uploads/' + ${photo}}" width="100" height="100" onclick="selectPhoto(this)">
  </div>
</div>

<div class="error-message" id="error-message"></div>

<script>
  function selectPhoto(imgElement) {
    const fileInput = document.getElementById('file');
    const dataTransfer = new DataTransfer();
    const allowedExtensions = ['jpg', 'jpeg', 'png'];

    const photoUrl = imgElement.src;
    const fileExtension = photoUrl.split('.').pop().toLowerCase();
    console.log("File Extension: ", fileExtension); // 로그 추가
    if (!allowedExtensions.includes(fileExtension)) {
      document.getElementById('error-message').innerText = '허용되지 않는 파일 형식입니다. jpg, jpeg, png 파일만 가능합니다.';
      return;
    }

    fetch(photoUrl)
            .then(response => response.blob())
            .then(blob => {
              const fileName = photoUrl.split('/').pop().replace(/[^\w.-]+/g, '_'); // 파일 이름에서 문제되는 문자를 대체
              const file = new File([blob], fileName, { type: blob.type });
              console.log("Created File: ", file); // 로그 추가
              dataTransfer.items.add(file);
              fileInput.files = dataTransfer.files;
              console.log("File Input Files: ", fileInput.files); // 로그 추가
              document.getElementById('error-message').innerText = ''; // 오류 메시지 지우기
            })
            .catch(error => {
              console.error('Error selecting photo:', error);
            });
  }
</script>
</body>
</html>
