spring:
  application:
    name: backend
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME}  # Placeholder for a more secure authentication mechanism (see note below)
      password: ${SPRING_SECURITY_USER_PASSWORD}  # Replace with encrypted password using Spring Security
  # 로컬용
  #  datasource:
  #    driver-class-name: com.mysql.cj.jdbc.Driver
  #    url: ${SPRING_DATASOURCE_URL}
  #    username: ${MYSQL_USER}
  #    password: ${MYSQL_PASSWORD}
  # 도커용
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
  profiles:
    include: API-KEY

  data:
    redis:
      host: redis
      port: 6379
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  address: 0.0.0.0
  port: 8080

springdoc:
  swagger-ui:
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: method
    disable-swagger-default-url: true
    display-request-duration: true
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
  api-docs:
    path: /api-docs
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  model-and-view-allowed: true
  paths-to-match:
    - /api/v1/**

openai:
  api-key: ${OPENAI_API_URL}
chatgpt:
  api-key: ${CHATGPT_API_KEY}
